<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1879" viewBox="0 0 1200 1879" role="img" aria-labelledby="title"><title id="title">From scanned directory page to parsed membership edges</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#81917d"/></marker></defs><rect width="1200" height="1879" fill="#fbfaf6"/><text x="44" y="49" font-family="serif" font-size="30" font-weight="600" fill="#303830">From scanned directory page to parsed membership edges</text><text x="44" y="84" font-family="sans-serif" font-size="18" font-weight="400" fill="#687367">Baltimore Blue Book · 1982 · Example entry: Miss Anne Toy</text><path d="M44 108H1156" stroke="#ccd3c8"/><rect x="44" y="145" width="1112" height="95" fill="#fff" stroke="#d3d9cf"/><text x="65" y="179" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">01</text><text x="112" y="179" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Scan and input page</text><text x="112" y="211" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Scanned page from the 1982 Baltimore Blue Book.</text><path d="M600 250v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="276" width="1112" height="155" fill="#fff" stroke="#d3d9cf"/><text x="65" y="310" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">02</text><text x="112" y="310" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Locate target entry</text><text x="112" y="342" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Zoom to the specific row for extraction.</text><rect x="112" y="359" width="1016" height="51" fill="#f4f6f1"/><text x="130" y="387" font-family="monospace" font-size="18" font-weight="400" fill="#303830">Martien, Miss Anne Toy 2, 397, Green Mt. ’75; U.ofBalto. ’80</text><path d="M600 441v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="467" width="1112" height="155" fill="#fff" stroke="#d3d9cf"/><text x="65" y="501" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">03</text><text x="112" y="501" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">OCR extraction</text><text x="112" y="533" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Convert the line to raw text using OCR.</text><rect x="112" y="550" width="1016" height="51" fill="#f4f6f1"/><text x="130" y="578" font-family="monospace" font-size="18" font-weight="400" fill="#303830">Martien, Miss Anne Toy 2, 397, Green Mt. ’75; U.ofBalto. ’80</text><path d="M600 632v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="658" width="1112" height="330" fill="#fff" stroke="#d3d9cf"/><text x="65" y="692" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">04</text><text x="112" y="692" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Parse into structured fields</text><text x="112" y="724" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Custom parser extracts key fields and outputs JSON.</text><rect x="112" y="741" width="1016" height="240" fill="#f4f6f1"/><text x="130" y="769" font-family="monospace" font-size="18" font-weight="400" fill="#303830">{</text><text x="130" y="796" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;Household_Name&quot;: &quot;Martien&quot;,</text><text x="130" y="823" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;Membership_Codes&quot;: [2, 397],</text><text x="130" y="850" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;Education_Text&quot;: &quot;Green Mt. ’75; U.ofBalto. ’80&quot;,</text><text x="130" y="877" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;Address&quot;: null,</text><text x="130" y="904" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;Phone&quot;: null,</text><text x="130" y="931" font-family="monospace" font-size="18" font-weight="400" fill="#303830">  &quot;low_confidence&quot;: false</text><text x="130" y="958" font-family="monospace" font-size="18" font-weight="400" fill="#303830">}</text><path d="M600 998v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1024" width="1112" height="285" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1058" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">05</text><text x="112" y="1058" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Normalize and save</text><text x="112" y="1090" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Postprocessor normalizes fields and assigns a stable ID.</text><rect x="112" y="1108" width="1016" height="88" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="1108" width="1016" height="44" fill="#eef2e9"/><text x="124" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">record_id</text><text x="124" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">1982-030-016</text><text x="339" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">year</text><text x="339" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">1982</text><text x="419" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">page</text><text x="419" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">303</text><text x="499" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">entry_num</text><text x="499" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">16</text><text x="629" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">household_name</text><text x="629" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Martien</text><text x="829" y="1136" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">membership_codes</text><text x="829" y="1180" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">2, 397</text><path d="M112 1152H1128" stroke="#d3d9cf"/><rect x="112" y="1206" width="1016" height="88" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="1206" width="1016" height="44" fill="#eef2e9"/><text x="124" y="1234" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">education_text</text><text x="124" y="1278" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Green Mt. ’75; U.ofBalto. ’80</text><text x="644" y="1234" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">address</text><text x="644" y="1278" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">null</text><text x="789" y="1234" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">phone</text><text x="789" y="1278" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">null</text><text x="934" y="1234" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">low_confidence</text><text x="934" y="1278" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">false</text><path d="M112 1250H1128" stroke="#d3d9cf"/><path d="M600 1319v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1345" width="1112" height="235" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1379" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">06</text><text x="112" y="1379" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Match membership codes</text><text x="112" y="1411" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Codes are matched to organization names using a lookup table.</text><rect x="112" y="1429" width="1016" height="132" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="1429" width="1016" height="44" fill="#eef2e9"/><text x="124" y="1457" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">Membership code</text><text x="124" y="1501" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">2</text><text x="124" y="1545" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">397</text><text x="414" y="1457" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">Organization name</text><text x="414" y="1501" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Baltimore County Club</text><text x="414" y="1545" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">English-Speaking Union</text><path d="M112 1473H1128" stroke="#d3d9cf"/><path d="M112 1517H1128" stroke="#d3d9cf"/><path d="M600 1590v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1616" width="1112" height="235" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1650" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">07</text><text x="112" y="1650" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Create person–organization edges</text><text x="112" y="1682" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Split the row into one person–organization edge per membership code.</text><rect x="112" y="1700" width="1016" height="132" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="1700" width="1016" height="44" fill="#eef2e9"/><text x="124" y="1728" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">person_name</text><text x="124" y="1772" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Martien, Miss Anne Toy</text><text x="124" y="1816" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Martien, Miss Anne Toy</text><text x="574" y="1728" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">organization_name</text><text x="574" y="1772" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Baltimore County Club</text><text x="574" y="1816" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">English-Speaking Union</text><path d="M112 1744H1128" stroke="#d3d9cf"/><path d="M112 1788H1128" stroke="#d3d9cf"/></svg>