<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1614" viewBox="0 0 1200 1614" role="img" aria-labelledby="title"><title id="title">From person–organization edges to a shared-member network</title><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#81917d"/></marker></defs><rect width="1200" height="1614" fill="#fbfaf6"/><text x="44" y="49" font-family="serif" font-size="30" font-weight="600" fill="#303830">From person–organization edges to a shared-member network</text><text x="44" y="84" font-family="sans-serif" font-size="18" font-weight="400" fill="#687367">Baltimore Blue Book · 1982 · How one entry contributes to the graph</text><path d="M44 108H1156" stroke="#ccd3c8"/><rect x="44" y="145" width="1112" height="190" fill="#fff" stroke="#d3d9cf"/><text x="65" y="179" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">01</text><text x="112" y="179" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Input person–organization edge</text><text x="112" y="211" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Row 37213 from the parsed dataset.</text><rect x="112" y="228" width="1016" height="78" fill="#f4f6f1"/><text x="130" y="256" font-family="monospace" font-size="18" font-weight="400" fill="#303830">membership_codes: 2|397</text><text x="130" y="283" font-family="monospace" font-size="18" font-weight="400" fill="#303830">membership_names: Baltimore County Club | English-Speaking Union</text><path d="M600 345v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="371" width="1112" height="235" fill="#fff" stroke="#d3d9cf"/><text x="65" y="405" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">02</text><text x="112" y="405" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Expand to person–organization edges</text><text x="112" y="437" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Write to person_membership_edges_research.csv (line 27443).</text><rect x="112" y="455" width="1016" height="132" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="455" width="1016" height="44" fill="#eef2e9"/><text x="124" y="483" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">person_name</text><text x="124" y="527" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Anne Toy</text><text x="124" y="571" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Anne Toy</text><text x="504" y="483" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">organization_name</text><text x="504" y="527" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Baltimore County Club</text><text x="504" y="571" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">English-Speaking Union</text><path d="M112 499H1128" stroke="#d3d9cf"/><path d="M112 543H1128" stroke="#d3d9cf"/><path d="M600 616v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="642" width="1112" height="100" fill="#fff" stroke="#d3d9cf"/><text x="65" y="676" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">03</text><text x="112" y="676" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Count shared members</text><text x="112" y="708" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">For each year, organizations on the same row are counted as a connected pair.</text><path d="M600 752v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="778" width="1112" height="195" fill="#fff" stroke="#d3d9cf"/><text x="65" y="812" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">04</text><text x="112" y="812" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Edge file (1982)</text><text x="112" y="844" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Appears in network_edges_by_year.csv (line 3657).</text><rect x="112" y="862" width="1016" height="88" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="862" width="1016" height="44" fill="#eef2e9"/><text x="124" y="890" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">year</text><text x="124" y="934" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">1982</text><text x="214" y="890" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">source</text><text x="214" y="934" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Baltimore County Club</text><text x="559" y="890" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">target</text><text x="559" y="934" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">English-Speaking Union</text><text x="904" y="890" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">shared_member_rows</text><text x="904" y="934" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">35</text><path d="M112 906H1128" stroke="#d3d9cf"/><path d="M600 983v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1009" width="1112" height="235" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1043" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">05</text><text x="112" y="1043" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Node sizes (1982)</text><text x="112" y="1075" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Contributes to network_nodes_by_year.csv (line 833).</text><rect x="112" y="1093" width="1016" height="132" fill="#fff" stroke="#d3d9cf"/><rect x="112" y="1093" width="1016" height="44" fill="#eef2e9"/><text x="124" y="1121" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">organization_name</text><text x="124" y="1165" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">Baltimore County Club</text><text x="124" y="1209" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">English-Speaking Union</text><text x="824" y="1121" font-family="sans-serif" font-size="16" font-weight="600" fill="#303830">member_rows</text><text x="824" y="1165" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">297</text><text x="824" y="1209" font-family="sans-serif" font-size="16" font-weight="400" fill="#303830">153</text><path d="M112 1137H1128" stroke="#d3d9cf"/><path d="M112 1181H1128" stroke="#d3d9cf"/><path d="M600 1254v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1280" width="1112" height="135" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1314" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">06</text><text x="112" y="1314" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Graph construction</text><text x="112" y="1346" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">generate_interactive_network_graph.py (line 54) reads the node and edge files.</text><text x="112" y="1373" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Nodes are sized by member_rows. Edges are drawn when enough shared members exist.</text><path d="M600 1425v16" stroke="#81917d" marker-end="url(#arrow)"/><rect x="44" y="1451" width="1112" height="135" fill="#fff" stroke="#d3d9cf"/><text x="65" y="1485" font-family="sans-serif" font-size="19" font-weight="600" fill="#596d60">07</text><text x="112" y="1485" font-family="sans-serif" font-size="23" font-weight="600" fill="#303830">Result</text><text x="112" y="1517" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">Anne Toy’s 1982 row increases node sizes for both organizations</text><text x="112" y="1544" font-family="sans-serif" font-size="19" font-weight="400" fill="#303830">and adds a weighted edge between them (+1 shared member row).</text></svg>